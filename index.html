<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toca y descubre — Casa Sherman × tapnovaStudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --beige:      #EFE6D2;
    --beige-card: #F9F4E7;
    --cardon:     #33302B;
    --cardon-soft:#4A453C;
    --pine:       #2C4736;
    --gold:       #C79A3E;
    --gold-soft:  #E9D6A5;
    --line:       rgba(51,48,43,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--beige);
    color:var(--cardon);
    font-family:'Work Sans', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
  h1,h2{ font-family:'Fraunces', serif; margin:0; color:var(--cardon); }

  .stage{
    width:100%;
    max-width:400px;
    text-align:center;
    position:relative;
  }

  .mark-wrap{
    width:108px; height:108px;
    margin:0 auto 22px;
    position:relative;
  }
  .mark-wrap svg{ width:100%; height:100%; transition:transform .6s cubic-bezier(.22,1,.36,1); }
  .mark-wrap.spinning svg{ animation:spin-fast 1.1s cubic-bezier(.5,0,.3,1); }
  @keyframes spin-fast{
    0%{ transform:rotate(0deg) scale(1); }
    70%{ transform:rotate(900deg) scale(1.08); }
    100%{ transform:rotate(1080deg) scale(1); }
  }

  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--cardon-soft);
    margin-bottom:10px;
  }

  #idle h1{ font-size:30px; line-height:1.15; margin-bottom:12px; }
  #idle p{ font-size:15px; color:var(--cardon-soft); line-height:1.6; max-width:300px; margin:0 auto 30px; }

  .tap-btn{
    appearance:none; border:none; cursor:pointer;
    background:var(--pine);
    color:var(--beige-card);
    font-family:'Work Sans', sans-serif;
    font-size:15px; font-weight:600; letter-spacing:0.02em;
    padding:16px 40px;
    border-radius:100px;
    box-shadow:0 6px 20px rgba(44,71,54,0.25);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .tap-btn:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(44,71,54,0.3); }
  .tap-btn:active{ transform:translateY(0) scale(0.98); }
  .tap-hint{
    margin-top:14px;
    font-size:12px;
    color:var(--cardon-soft);
  }

  .result-card{
    background:var(--beige-card);
    border:1px solid var(--line);
    border-radius:22px;
    padding:38px 30px 30px;
    opacity:0;
    transform:translateY(14px) scale(0.97);
    transition:opacity .5s ease, transform .5s cubic-bezier(.22,1,.36,1);
  }
  .result-card.show{ opacity:1; transform:translateY(0) scale(1); }

  .tag{
    display:inline-block;
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    padding:6px 14px;
    border-radius:100px;
    margin-bottom:18px;
  }
  .tag.win{ background:var(--gold-soft); color:#5C4310; }
  .tag.phrase{ background:rgba(44,71,54,0.1); color:var(--pine); }

  .result-card h2{ font-size:26px; line-height:1.25; margin-bottom:14px; }
  .result-card .body-text{ font-size:15.5px; line-height:1.65; color:var(--cardon-soft); margin-bottom:6px; }
  .result-card .ref{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--cardon-soft);
    margin-top:8px;
  }

  .result-actions{
    display:flex; gap:10px; justify-content:center;
    margin-top:26px; flex-wrap:wrap;
  }
  .btn-sm{
    appearance:none; cursor:pointer; text-decoration:none;
    font-family:'Work Sans', sans-serif;
    font-size:13px; font-weight:500;
    padding:11px 20px; border-radius:100px;
    border:1px solid var(--line);
    background:transparent; color:var(--cardon);
  }
  .btn-sm.primary{ background:var(--pine); color:var(--beige-card); border-color:var(--pine); }

  .again{
    margin-top:22px;
    font-size:12px;
    color:var(--cardon-soft);
  }
  .again button{
    appearance:none; background:none; border:none; cursor:pointer;
    color:var(--cardon-soft); text-decoration:underline;
    font-family:inherit; font-size:12px; padding:0;
  }

  footer{
    margin-top:34px;
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--cardon-soft);
  }

  .confetti{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:5;
  }
  .confetti i{
    position:absolute; top:-10px;
    width:8px; height:14px;
    opacity:0.9;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(400deg); opacity:0.4; }
  }

  .demo-badge{
    position:fixed; top:16px; right:16px;
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--cardon-soft);
  }
</style>
</head>
<body>

<div class="demo-badge">Demo — tapnovaStudio</div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="mark" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="98" fill="var(--pine)"/>
    <g stroke="var(--beige-card)" stroke-linecap="round" fill="none" id="rays"></g>
    <circle cx="100" cy="100" r="34" fill="var(--beige-card)"/>
    <text x="100" y="115" font-family="Georgia, serif" font-size="42" font-weight="700" fill="var(--pine)" text-anchor="middle">S</text>
  </symbol>
</svg>

<div class="stage">
  <div class="mark-wrap" id="markWrap">
    <svg viewBox="0 0 200 200"><use href="#mark"/></svg>
  </div>

  <div id="idle">
    <div class="eyebrow" id="clienteNombre"></div>
    <h1>Toca y descubre<br>tu sorpresa.</h1>
    <p>Acerca tu teléfono al sticker — o presiona el botón para simular el tap.</p>
    <button class="tap-btn" id="tapBtn">Simular tap NFC</button>
    <div class="tap-hint">1 de cada 30 taps gana un premio</div>
  </div>

  <div id="result" class="result-card">
    <div class="tag" id="tag"></div>
    <h2 id="title"></h2>
    <p class="body-text" id="body"></p>
    <p class="ref" id="ref"></p>
    <div class="result-actions" id="actions"></div>
  </div>

  <div class="again" id="again" style="display:none;">
    <button id="againBtn">Demo: volver a intentar</button>
  </div>

  <footer id="creditoPie"></footer>
</div>

<script src="config.js"></script>
<script>
  (function(){
    const rays = document.getElementById('rays');
    const cx = 100, cy = 100, n = 40;
    for(let i=0;i<n;i++){
      const angle = (i * (360/n) - 90) * Math.PI/180;
      const even = i % 2 === 0;
      const ri = even ? 40 : 44;
      const ro = even ? 90 : 78;
      const sw = even ? 2.4 : 2.0;
      const x1 = cx + ri*Math.cos(angle), y1 = cy + ri*Math.sin(angle);
      const x2 = cx + ro*Math.cos(angle), y2 = cy + ro*Math.sin(angle);
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',x1.toFixed(1)); line.setAttribute('y1',y1.toFixed(1));
      line.setAttribute('x2',x2.toFixed(1)); line.setAttribute('y2',y2.toFixed(1));
      line.setAttribute('stroke-width',sw);
      rays.appendChild(line);
    }
  })();

  const CFG = window.TAP_CONFIG;

  const PRIZES = CFG.premios.map(p => ({ title: p.titulo, body: p.cuerpo, ref: p.vigencia }));
  const PHRASES = CFG.frases.map(f => ({ body: f.texto, ref: f.referencia }));
  const WIN_PROBABILITY = CFG.probabilidadDePremio;

  document.getElementById('clienteNombre').textContent = CFG.cliente;
  document.getElementById('creditoPie').textContent = CFG.creditoPie;

  const markWrap = document.getElementById('markWrap');
  const tapBtn = document.getElementById('tapBtn');
  const idle = document.getElementById('idle');
  const result = document.getElementById('result');
  const tag = document.getElementById('tag');
  const title = document.getElementById('title');
  const body = document.getElementById('body');
  const ref = document.getElementById('ref');
  const actions = document.getElementById('actions');
  const again = document.getElementById('again');
  const againBtn = document.getElementById('againBtn');

  function shareText(text){
    if(navigator.share){
      navigator.share({ text }).catch(()=>{});
    } else {
      navigator.clipboard?.writeText(text);
      alert('Copiado — listo para compartir');
    }
  }

  function launchConfetti(){
    const colors = ['#C79A3E','#2C4736','#E9D6A5','#33302B'];
    const wrap = document.createElement('div');
    wrap.className = 'confetti';
    document.body.appendChild(wrap);
    for(let i=0;i<60;i++){
      const c = document.createElement('i');
      c.style.left = Math.random()*100 + 'vw';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
      c.style.animationDelay = (Math.random()*0.4) + 's';
      wrap.appendChild(c);
    }
    setTimeout(()=>wrap.remove(), 4200);
  }

  function reveal(){
    const won = Math.random() < WIN_PROBABILITY;

    if(won){
      const p = PRIZES[Math.floor(Math.random()*PRIZES.length)];
      tag.className = 'tag win'; tag.textContent = 'Premio';
      title.textContent = p.title;
      body.textContent = p.body;
      const hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
      ref.textContent = p.ref + ' · Tap: ' + hora;
      actions.innerHTML = '<button class="btn-sm primary" id="shareBtn">Compartir mi premio</button>';
      launchConfetti();
    } else {
      const f = PHRASES[Math.floor(Math.random()*PHRASES.length)];
      tag.className = 'tag phrase'; tag.textContent = 'Para tu día';
      title.textContent = '“' + f.body + '”';
      body.textContent = '';
      ref.textContent = f.ref;
      actions.innerHTML = '<button class="btn-sm primary" id="shareBtn">Compartir frase</button>';
    }

    document.getElementById('shareBtn').addEventListener('click', ()=>{
      shareText((title.textContent + ' ' + body.textContent).trim() + ' — Casa Sherman');
    });

    idle.style.display = 'none';
    result.classList.add('show');
    again.style.display = 'block';
  }

  tapBtn.addEventListener('click', ()=>{
    markWrap.classList.add('spinning');
    tapBtn.disabled = true;
    setTimeout(reveal, 900);
  });

  againBtn.addEventListener('click', ()=>{
    result.classList.remove('show');
    again.style.display = 'none';
    markWrap.classList.remove('spinning');
    tapBtn.disabled = false;
    setTimeout(()=>{ idle.style.display = 'block'; }, 300);
  });
</script>

</body>
</html>
