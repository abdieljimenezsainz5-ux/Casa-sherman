<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toca y descubre — Casa Sherman × tapnovaStudio</title>
<style>
  :root{
    --beige:      #EFE6D2;
    --beige-card: #F9F4E7;
    --cardon:     #33302B;
    --cardon-soft:#4A453C;
    --pine:       #2C4736;
    --gold:       #C79A3E;
    --gold-soft:  #E9D6A5;
    --line:       rgba(51,48,43,0.14);
    --font-serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
    --font-sans:  -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono:  'SF Mono', 'Courier New', Courier, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--beige);
    color:var(--cardon);
    font-family:var(--font-sans);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
  h1,h2{ font-family:var(--font-serif); margin:0; color:var(--cardon); }

  .stage{
    width:100%;
    max-width:400px;
    text-align:center;
    position:relative;
  }

  .mark-wrap{
    width:108px; height:108px;
    margin:0 auto 22px;
    position:relative;
  }
  .mark-wrap svg{ width:100%; height:100%; transition:transform .6s cubic-bezier(.22,1,.36,1); }
  .mark-wrap.spinning svg{ animation:spin-fast 1.1s cubic-bezier(.5,0,.3,1); }
  @keyframes spin-fast{
    0%{ transform:rotate(0deg) scale(1); }
    70%{ transform:rotate(900deg) scale(1.08); }
    100%{ transform:rotate(1080deg) scale(1); }
  }

  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--cardon-soft);
    margin-bottom:10px;
  }

  #idle h1{ font-size:30px; line-height:1.15; margin-bottom:12px; }
  #idle p{ font-size:15px; color:var(--cardon-soft); line-height:1.6; max-width:300px; margin:0 auto 30px; }

  .tap-btn{
    appearance:none; border:none; cursor:pointer;
    background:var(--pine);
    color:var(--beige-card);
    font-family:var(--font-sans);
    font-size:15px; font-weight:600; letter-spacing:0.02em;
    padding:16px 40px;
    border-radius:100px;
    box-shadow:0 6px 20px rgba(44,71,54,0.25);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .tap-btn:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(44,71,54,0.3); }
  .tap-btn:active{ transform:translateY(0) scale(0.98); }
  .tap-hint{
    margin-top:14px;
    font-size:12px;
    color:var(--cardon-soft);
  }

  .result-card{
    background:var(--beige-card);
    border:1px solid var(--line);
    border-radius:22px;
    padding:38px 30px 30px;
    opacity:0;
    transform:translateY(14px) scale(0.97);
    transition:opacity .5s ease, transform .5s cubic-bezier(.22,1,.36,1);
  }
  .result-card.show{ opacity:1; transform:translateY(0) scale(1); }

  .tag{
    display:inline-block;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    padding:6px 14px;
    border-radius:100px;
    margin-bottom:18px;
  }
  .tag.win{ background:var(--gold-soft); color:#5C4310; }
  .tag.phrase{ background:rgba(44,71,54,0.1); color:var(--pine); }

  .result-card h2{ font-size:26px; line-height:1.25; margin-bottom:14px; }
  .result-card .body-text{ font-size:15.5px; line-height:1.65; color:var(--cardon-soft); margin-bottom:6px; }
  .result-card .ref{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--cardon-soft);
    margin-top:8px;
  }

  .result-actions{
    display:flex; gap:10px; justify-content:center;
    margin-top:26px; flex-wrap:wrap;
  }
  .btn-sm{
    appearance:none; cursor:pointer; text-decoration:none;
    font-family:var(--font-sans);
    font-size:13px; font-weight:500;
    padding:11px 20px; border-radius:100px;
    border:1px solid var(--line);
    background:transparent; color:var(--cardon);
  }
  .btn-sm.primary{ background:var(--pine); color:var(--beige-card); border-color:var(--pine); }

  .again{
    margin-top:22px;
    font-size:12px;
    color:var(--cardon-soft);
  }
  .again button{
    appearance:none; background:none; border:none; cursor:pointer;
    color:var(--cardon-soft); text-decoration:underline;
    font-family:inherit; font-size:12px; padding:0;
  }

  footer{
    margin-top:34px;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--cardon-soft);
  }

  .confetti{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:5;
  }
  .confetti i{
    position:absolute; top:-10px;
    width:8px; height:14px;
    opacity:0.9;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(400deg); opacity:0.4; }
  }

  .demo-badge{
    position:fixed; top:16px; right:16px;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--cardon-soft);
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="mark" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="98" fill="var(--pine)"/>
    <g stroke="var(--beige-card)" stroke-linecap="round" fill="none" id="rays"></g>
    <circle cx="100" cy="100" r="34" fill="var(--beige-card)"/>
    <text x="100" y="115" font-family="Georgia, serif" font-size="42" font-weight="700" fill="var(--pine)" text-anchor="middle">S</text>
  </symbol>
</svg>

<div class="stage">
  <div class="mark-wrap" id="markWrap">
    <svg viewBox="0 0 200 200"><use href="#mark"/></svg>
  </div>

  <div id="idle">
    <div class="eyebrow" id="clienteNombre"></div>
    <h1>Toca y descubre<br>tu sorpresa.</h1>
    <p>Un momento, estamos preparando tu sorpresa...</p>
  </div>

  <div id="result" class="result-card">
    <div class="tag" id="tag"></div>
    <h2 id="title"></h2>
    <p class="body-text" id="body"></p>
    <p class="ref" id="ref"></p>
    <div class="result-actions" id="actions"></div>
    <p id="alreadyPlayedNote" style="display:none; margin-top:20px; font-size:12px; color:var(--cardon-soft);">Ya participaste hoy — vuelve mañana por otra oportunidad.</p>
  </div>

  <footer id="creditoPie"></footer>
</div>

<script src="config.js"></script>
<script>
  (function(){
    const rays = document.getElementById('rays');
    const cx = 100, cy = 100, n = 40;
    for(let i=0;i<n;i++){
      const angle = (i * (360/n) - 90) * Math.PI/180;
      const even = i % 2 === 0;
      const ri = even ? 40 : 44;
      const ro = even ? 90 : 78;
      const sw = even ? 2.4 : 2.0;
      const x1 = cx + ri*Math.cos(angle), y1 = cy + ri*Math.sin(angle);
      const x2 = cx + ro*Math.cos(angle), y2 = cy + ro*Math.sin(angle);
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',x1.toFixed(1)); line.setAttribute('y1',y1.toFixed(1));
      line.setAttribute('x2',x2.toFixed(1)); line.setAttribute('y2',y2.toFixed(1));
      line.setAttribute('stroke-width',sw);
      rays.appendChild(line);
    }
  })();

  const CFG = window.TAP_CONFIG;

  const PRIZES = CFG.premios.map(p => ({ title: p.titulo, body: p.cuerpo, ref: p.vigencia }));
  const PHRASES = CFG.frases.map(f => ({ body: f.texto, ref: f.referencia }));
  const WIN_PROBABILITY = CFG.probabilidadDePremio;

  document.getElementById('clienteNombre').textContent = CFG.cliente;
  document.getElementById('creditoPie').textContent = CFG.creditoPie;

  const markWrap = document.getElementById('markWrap');
  const idle = document.getElementById('idle');
  const result = document.getElementById('result');
  const tag = document.getElementById('tag');
  const title = document.getElementById('title');
  const body = document.getElementById('body');
  const ref = document.getElementById('ref');
  const actions = document.getElementById('actions');

  function wrapText(ctx, text, x, y, maxWidth, lineHeight){
    const words = text.split(' ');
    let line = '';
    let lines = [];
    for(let n=0; n<words.length; n++){
      const testLine = line + words[n] + ' ';
      if(ctx.measureText(testLine).width > maxWidth && n > 0){
        lines.push(line.trim());
        line = words[n] + ' ';
      } else {
        line = testLine;
      }
    }
    lines.push(line.trim());
    lines.forEach((l, i) => ctx.fillText(l, x, y + i*lineHeight));
    return lines.length;
  }

  function generateShareImage(isWin, titleText, bodyText, refText){
    const W = 1080, H = 1350;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    const accent = isWin ? '#5C4310' : '#2C4736';
    const pillBg = isWin ? '#E9D6A5' : 'rgba(44,71,54,0.12)';
    const cardBg = '#F9F4E7';

    // Fondo con degradado suave
    const bgGrad = ctx.createLinearGradient(0,0,0,H);
    if(isWin){
      bgGrad.addColorStop(0, '#F6ECD0');
      bgGrad.addColorStop(1, '#EFE0BC');
    } else {
      bgGrad.addColorStop(0, '#F2EAD9');
      bgGrad.addColorStop(1, '#E9DFC8');
    }
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0,0,W,H);

    // textura sutil de línea diagonal (igual que la página)
    ctx.save();
    ctx.strokeStyle = isWin ? 'rgba(199,154,62,0.10)' : 'rgba(44,71,54,0.06)';
    ctx.lineWidth = 2;
    for(let i=-H; i<W+H; i+=46){
      ctx.beginPath();
      ctx.moveTo(i, 0);
      ctx.lineTo(i+H*0.5, H);
      ctx.stroke();
    }
    ctx.restore();

    // marca circular con rayos tipo sunburst
    const cx = W/2, cy = 225, rOuter = 118, rInner = 44;
    const n = 40;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.18)';
    ctx.shadowBlur = 30;
    ctx.shadowOffsetY = 10;
    ctx.beginPath();
    ctx.arc(cx, cy, rOuter, 0, Math.PI*2);
    ctx.fillStyle = '#2C4736';
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = '#F9F4E7';
    for(let i=0;i<n;i++){
      const angle = (i*(360/n)-90) * Math.PI/180;
      const even = i%2===0;
      const ri = even ? 48 : 52, ro = even ? 104 : 92;
      ctx.lineWidth = even ? 3 : 2.4;
      ctx.beginPath();
      ctx.moveTo(cx+ri*Math.cos(angle), cy+ri*Math.sin(angle));
      ctx.lineTo(cx+ro*Math.cos(angle), cy+ro*Math.sin(angle));
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(cx, cy, rInner, 0, Math.PI*2);
    ctx.fillStyle = '#F9F4E7';
    ctx.fill();
    ctx.fillStyle = '#2C4736';
    ctx.font = '700 56px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('S', cx, cy+20);

    // píldora de etiqueta (Premio / Para tu día)
    const label = isWin ? 'PREMIO' : 'PARA TU DÍA';
    ctx.font = '700 24px sans-serif';
    const labelW = ctx.measureText(label).width + 64;
    const labelX = W/2 - labelW/2, labelY = 372;
    roundRect(ctx, labelX, labelY, labelW, 52, 26);
    ctx.fillStyle = pillBg;
    ctx.fill();
    ctx.fillStyle = accent;
    ctx.textAlign = 'center';
    ctx.fillText(label, W/2, labelY+34);

    // tarjeta central con sombra elegante
    const cardX = 80, cardY = 460, cardW = W-160, cardH = 570;
    ctx.save();
    ctx.shadowColor = 'rgba(51,48,43,0.18)';
    ctx.shadowBlur = 45;
    ctx.shadowOffsetY = 18;
    roundRect(ctx, cardX, cardY, cardW, cardH, 32);
    ctx.fillStyle = cardBg;
    ctx.fill();
    ctx.restore();

    // borde dorado fino
    roundRect(ctx, cardX, cardY, cardW, cardH, 32);
    ctx.strokeStyle = isWin ? 'rgba(199,154,62,0.55)' : 'rgba(44,71,54,0.15)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // línea decorativa superior dentro de la tarjeta
    ctx.strokeStyle = accent;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(W/2-40, cardY+56);
    ctx.lineTo(W/2+40, cardY+56);
    ctx.stroke();

    ctx.fillStyle = '#33302B';
    ctx.font = '600 54px Georgia, serif';
    ctx.textAlign = 'center';
    const titleLines = wrapText(ctx, titleText, W/2, cardY+140, cardW-110, 66);

    if(bodyText){
      ctx.font = '400 30px sans-serif';
      ctx.fillStyle = '#4A453C';
      wrapText(ctx, bodyText, W/2, cardY+140+titleLines*66+46, cardW-140, 44);
    }

    // línea decorativa inferior + referencia
    const refY = cardY+cardH-70;
    ctx.strokeStyle = 'rgba(51,48,43,0.15)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cardX+70, refY-26);
    ctx.lineTo(cardX+cardW-70, refY-26);
    ctx.stroke();

    ctx.font = '400 24px monospace';
    ctx.fillStyle = '#4A453C';
    ctx.fillText(refText, W/2, refY+6);

    // pie de marca
    ctx.font = '700 28px sans-serif';
    ctx.fillStyle = '#2C4736';
    ctx.textAlign = 'center';
    ctx.letterSpacing = '2px';
    ctx.fillText('CASA SHERMAN', W/2, H-88);
    ctx.letterSpacing = '0px';
    ctx.font = '400 20px monospace';
    ctx.fillStyle = 'rgba(74,69,60,0.7)';
    ctx.fillText('TAPNOVASTUDIO.MX', W/2, H-52);

    return canvas;
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  async function shareAsImage(isWin, titleText, bodyText, refText){
    const canvas = generateShareImage(isWin, titleText, bodyText, refText);
    canvas.toBlob(async (blob) => {
      const file = new File([blob], 'casa-sherman.png', { type: 'image/png' });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        try{
          await navigator.share({ files: [file], text: 'Casa Sherman' });
        }catch(e){ /* usuario canceló, no pasa nada */ }
      } else {
        // Fallback: descarga la imagen para subirla manualmente
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'casa-sherman.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 3000);
        alert('Imagen descargada — ya la puedes subir a Instagram o Facebook');
      }
    }, 'image/png');
  }

  function launchConfetti(){
    const colors = ['#C79A3E','#2C4736','#E9D6A5','#33302B'];
    const wrap = document.createElement('div');
    wrap.className = 'confetti';
    document.body.appendChild(wrap);
    for(let i=0;i<60;i++){
      const c = document.createElement('i');
      c.style.left = Math.random()*100 + 'vw';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
      c.style.animationDelay = (Math.random()*0.4) + 's';
      wrap.appendChild(c);
    }
    setTimeout(()=>wrap.remove(), 4200);
  }

  // Analítica básica sin backend propio (CountAPI: gratis, sin auth).
  // Namespace único por negocio para no mezclar contadores con otras demos.
  const ANALYTICS_NS = 'tapnovastudio-casasherman';
  function trackEvent(key){
    fetch('https://api.countapi.xyz/hit/' + ANALYTICS_NS + '/' + key).catch(()=>{});
  }

  function reveal(){
    const won = Math.random() < WIN_PROBABILITY;
    trackEvent('taps'); // cuenta cada vez que alguien toca el sticker

    if(won){
      const p = PRIZES[Math.floor(Math.random()*PRIZES.length)];
      tag.className = 'tag win'; tag.textContent = 'Premio';
      title.textContent = p.title;
      body.textContent = p.body;
      const hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
      ref.textContent = p.ref + ' · Tap: ' + hora;
      actions.innerHTML = '<button class="btn-sm primary" id="shareBtn">Compartir mi premio</button>';
      launchConfetti();
      trackEvent('premios'); // cuenta cuántos premios se han entregado
      if(navigator.vibrate){ navigator.vibrate(200); }
    } else {
      const f = PHRASES[Math.floor(Math.random()*PHRASES.length)];
      tag.className = 'tag phrase'; tag.textContent = 'Para tu día';
      title.textContent = '“' + f.body + '”';
      body.textContent = '';
      ref.textContent = f.ref;
      actions.innerHTML = '<button class="btn-sm primary" id="shareBtn">Compartir frase</button>';
    }

    document.getElementById('shareBtn').addEventListener('click', ()=>{
      shareAsImage(won, title.textContent, body.textContent, ref.textContent);
    });

    // Guarda el resultado de hoy para no dejar volver a jugar hasta mañana
    localStorage.setItem(PLAY_KEY, JSON.stringify({
      date: todayStr(),
      won: won,
      title: title.textContent,
      body: body.textContent,
      ref: ref.textContent
    }));

    idle.style.display = 'none';
    result.classList.add('show');
  }

  const PLAY_KEY = 'casaSherman_play';
  function todayStr(){ return new Date().toISOString().slice(0,10); }

  function showStoredResult(saved){
    tag.className = saved.won ? 'tag win' : 'tag phrase';
    tag.textContent = saved.won ? 'Premio' : 'Para tu día';
    title.textContent = saved.title;
    body.textContent = saved.body;
    ref.textContent = saved.ref;
    actions.innerHTML = '<button class="btn-sm primary" id="shareBtn">' + (saved.won ? 'Compartir mi premio' : 'Compartir frase') + '</button>';
    document.getElementById('shareBtn').addEventListener('click', ()=>{
      shareAsImage(saved.won, saved.title, saved.body, saved.ref);
    });
    document.getElementById('alreadyPlayedNote').style.display = 'block';
    idle.style.display = 'none';
    result.classList.add('show');
  }

  function startReveal(){
    let saved = null;
    try{ saved = JSON.parse(localStorage.getItem(PLAY_KEY)); }catch(e){}
    if(saved && saved.date === todayStr()){
      showStoredResult(saved);
      return;
    }
    markWrap.classList.add('spinning');
    setTimeout(reveal, 900);
  }

  // Se activa solo al abrir la página (simulando el tap real del NFC)
  window.addEventListener('load', startReveal);
</script>

</body>
</html>
